<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Programming Quiz-V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
     <link rel="icon" type="image/png" href="https://www.w3schools.com/js/img_javascript_480.jpg">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #111827;
            --text-muted: #6b7280;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --success-border: #22c55e;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --error-border: #ef4444;
            --border-radius: 16px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            width: 100%;
            max-width: 650px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }

        .hidden { display: none !important; }
        
        h1, h2 { 
            margin-top: 0; 
            font-weight: 700; 
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        h3 {
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        p { color: var(--text-muted); }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease;
            background-color: white;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            width: 100%;
        }

        button:hover:not(:disabled) { 
            background-color: var(--primary-hover); 
            transform: translateY(-1px);
        }

        .chapter-btn {
            display: block;
            text-align: left;
            background-color: #f3f4f6;
            color: var(--text-main);
            margin-bottom: 12px;
            box-shadow: none;
            border: 1px solid transparent;
        }

        .chapter-btn:hover:not(:disabled) {
            background-color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .option-btn {
            display: block;
            text-align: left;
            background-color: white;
            color: var(--text-main);
            margin-bottom: 12px;
            border: 2px solid #e5e7eb;
            font-weight: 500;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .btn-correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            color: var(--success-text) !important;
        }

        .btn-wrong {
            background-color: var(--error-bg) !important;
            border-color: var(--error-border) !important;
            color: var(--error-text) !important;
        }

        .disabled-btn {
            pointer-events: none;
            opacity: 0.7;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #e5e7eb;
            border-radius: 999px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .ai-box {
            background: #4b5563;
            padding: 16px;
            border-left: 4px solid var(--primary);
            margin-top: 20px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95em;
            color: #E5E7EF;
            line-height: 1.5;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 15px;
        }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .btn-secondary { background-color: #4b5563; box-shadow: none; width: auto; }
        .btn-secondary:hover:not(:disabled) { background-color: #374151; }
        
        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        /* --- Toggle Switch CSS --- */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
        }

        .toggle-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>

<div class="container">
    
    <div id="setup-section" style="text-align: center;">
        <h1>Web Programming</h1>
        <p style="margin-bottom: 30px;">Enter your name to begin the assessment.</p>
        
        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="student-name" placeholder="e.g. Brendan Eich">
        </div>

        <button onclick="startApp()">Access Modules</button>
    </div>

    <div id="chapters-section" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>Module Selection</h2>
        </div>
        <p style="margin-top: 0;">Logged in as: <strong id="display-name" style="color: var(--primary);"></strong></p>

        <div class="toggle-container">
            <span class="toggle-label">Enable AI Tutor Features</span>
            <label class="switch">
                <input type="checkbox" id="ai-toggle" checked onchange="toggleAI()">
                <span class="slider"></span>
            </label>
        </div>

        <div id="chapter-list" style="margin-top: 15px;">
            </div>
    </div>

    <div id="quiz-section" class="hidden">
        <div class="quiz-header">
            <div>
                <button onclick="backToChapters()" class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem; margin-bottom: 12px;">&larr; Back to Modules</button>
                <h2 id="quiz-title" style="margin: 0; font-size: 1.25rem;">Chapter Quiz</h2>
            </div>
            <span style="font-weight: 600; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 4px;">
                Question <span id="current-q-num">1</span> / <span id="total-q-num">X</span>
            </span>
        </div>
        
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        
        <h3 id="question-text"></h3>
        <div id="options-container">
            </div>
        
        <div id="ai-response" class="ai-box hidden"></div>

        <div class="quiz-controls">
            <button id="ai-hint-btn" onclick="getAIExplanation()" class="btn-secondary">Ask AI for a Hint</button>
            <button id="next-btn" onclick="proceedToNext()" class="hidden" style="margin-left: auto;">Continue &rarr;</button>
        </div>
    </div>

    <div id="results-section" class="hidden" style="text-align: center;">
        <h2>Assessment Complete</h2>
        
        
        <div class="score-display" id="final-score"></div>
        <p style="font-weight: 500; font-size: 1.1rem; margin-bottom: 30px;">Score: <span id="raw-score"></span></p>
        
        <button onclick="backToChapters()" class="btn-secondary" style="width: 100%;">Return to Modules</button>
    </div>

</div>

    // ==========================================
    // --- Randomize Options on Load ---
    // ==========================================
    function shuffleQuizOptions(data) {
        for (const key in data) {
            data[key].forEach(questionItem => {
                const options = questionItem.options;
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }
            });
        }
    }
    
    // Execute shuffle immediately so all questions are randomized
    shuffleQuizOptions(quizData);


    // --- State Variables ---
    let studentName = "";
    let currentChapterNum = 0;
    let currentQuestionIndex = 0;
    let correctAnswersCount = 0;
    let isAiEnabled = true;

    // --- Core Logic ---
    function switchSection(sectionId) {
        document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(sectionId).classList.remove('hidden');
    }

    function toggleAI() {
        isAiEnabled = document.getElementById('ai-toggle').checked;
    }

    function startApp() {
        const nameInput = document.getElementById('student-name').value.trim();
        if (!nameInput) return alert("Please enter your name to proceed.");
        
        studentName = nameInput;
        document.getElementById('display-name').innerText = studentName;
        renderChapters();
        switchSection('chapters-section');
    }

    function renderChapters() {
        const list = document.getElementById('chapter-list');
        list.innerHTML = ''; 
        
        for (let i = 1; i <= 5; i++) {
            const btn = document.createElement('button');
            btn.className = 'chapter-btn';
            const cName = chapterNames[i] || `Topic ${i}`;
            
            if (quizData[i] && quizData[i].length > 0) {
                btn.innerHTML = `<strong style="color: var(--primary);">${cName}</strong><br> ${quizData[i].length} Questions`;
                btn.onclick = () => startQuiz(i);
            } else {
                btn.innerHTML = `Module ${i}: ${cName} <span style="font-size: 0.8em; color: var(--text-muted); float: right;">Pending Upload</span>`;
                btn.disabled = true;
                btn.style.opacity = "0.5";
            }
            list.appendChild(btn);
        }
    }

    function startQuiz(chapterNum) {
        currentChapterNum = chapterNum;
        currentQuestionIndex = 0;
        correctAnswersCount = 0;
        
        const cName = chapterNames[chapterNum] || "";
        document.getElementById('quiz-title').innerText = `Module ${chapterNum}`;
        document.getElementById('total-q-num').innerText = quizData[chapterNum].length;
        
        loadQuestion();
        switchSection('quiz-section');
    }

    function loadQuestion() {
        document.getElementById('ai-response').classList.add('hidden');
        
        // Respect AI Toggle State for Hint Button
        if (isAiEnabled) {
            document.getElementById('ai-hint-btn').classList.remove('hidden');
        } else {
            document.getElementById('ai-hint-btn').classList.add('hidden');
        }
        
        document.getElementById('next-btn').classList.add('hidden');
        
        document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
        
        const progress = (currentQuestionIndex / quizData[currentChapterNum].length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
        
        const currentQ = quizData[currentChapterNum][currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQ.question;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQ.options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = (e) => handleAnswer(option, currentQ.answer, e.target);
            optionsContainer.appendChild(btn);
        });
    }

    function handleAnswer(selectedOption, correctOption, clickedBtn) {
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(btn => btn.classList.add('disabled-btn'));

        if (selectedOption === correctOption) {
            correctAnswersCount++;
            clickedBtn.classList.add('btn-correct');
            setTimeout(() => { proceedToNext(); }, 1500); 
        } else {
            clickedBtn.classList.add('btn-wrong');
            allButtons.forEach(btn => {
                if (btn.innerText === correctOption) {
                    btn.classList.add('btn-correct');
                }
            });

            // Respect AI Toggle State for Auto-Triggering Explaination
            if (isAiEnabled) {
                getAIExplanation(true);
                document.getElementById('ai-hint-btn').classList.add('hidden');
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }
    }

    function proceedToNext() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData[currentChapterNum].length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById('progress-bar').style.width = '100%';
        const total = quizData[currentChapterNum].length;
        const percentage = Math.round((correctAnswersCount / total) * 100);
        
        document.getElementById('raw-score').innerText = `${correctAnswersCount} / ${total}`;
        document.getElementById('final-score').innerText = `${percentage}%`;
        
        silentGoogleSheetSubmit(percentage);
        
        setTimeout(() => { switchSection('results-section'); }, 500); 
    }

async function silentGoogleSheetSubmit(percentage) {
        if(GOOGLE_SHEET_WEBAPP_URL === "YOUR_WEB_APP_URL_HERE") return;
        try {
            // Get the chapter name if it exists
            const cName = chapterNames[currentChapterNum];
            // Format it as "Chapter 1: HTML Fundamentals" or just "Chapter 1" if no name exists
            const chapterData = cName ? `Chapter ${currentChapterNum}: ${cName}` : `Chapter ${currentChapterNum}`;

            const formData = new URLSearchParams();
            formData.append('name', studentName);
            formData.append('chapter', chapterData); // <-- Updated this line
            formData.append('score', `${percentage}%`);

            fetch(GOOGLE_SHEET_WEBAPP_URL, {
                method: 'POST',
                body: formData
            }).then(response => {
                if(response.ok) console.log("Score automatically saved.");
            }).catch(e => console.error("Network issue during silent save.", e));
        } catch (error) {
            console.error("Error triggering submit:", error);
        }
    }

    function backToChapters() {
        switchSection('chapters-section');
    }

    // --- Live Dual AI Integration (Debug Version) ---
    async function getAIExplanation(isAutoTrigger = false) {
        const activeKey = API_KEYS[ACTIVE_AI_PROVIDER];
        const aiBox = document.getElementById('ai-response');
        const currentQ = quizData[currentChapterNum][currentQuestionIndex];

        if (!activeKey || activeKey.includes("YOUR_")) {
            aiBox.classList.remove('hidden');
            aiBox.innerHTML = `<strong>Configuration Error:</strong> Valid API key not found for ${ACTIVE_AI_PROVIDER.toUpperCase()}.`;
            return;
        }
        
        aiBox.classList.remove('hidden');
        aiBox.innerHTML = `<em>${isAutoTrigger ? "Generating explanation..." : "Connecting to " + ACTIVE_AI_PROVIDER.toUpperCase() + "..."}</em>`;
        
        const promptText = `You are a Web Programming tutor. A student is answering this multiple choice question: "${currentQ.question}". The correct answer is: "${currentQ.answer}". Provide a brief, one-paragraph explanation (max 1-3 sentences) of why this is the correct answer. Focus on explaining the underlying concept clearly. Do not use markdown formatting.`;

        try {
            let aiText = "";

            if (ACTIVE_AI_PROVIDER === 'gemini') {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${activeKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: { temperature: 0.3 }
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                const data = await response.json();
                aiText = data.candidates[0].content.parts[0].text;

            } else if (ACTIVE_AI_PROVIDER === 'groq') {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${activeKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", 
                        messages: [{ "role": "user", "content": promptText }],
                        temperature: 0.3
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                const data = await response.json();
                aiText = data.choices[0].message.content;
            }

            aiBox.innerHTML = `${aiText}`;

        } catch (error) {
            console.error("Detailed API Error:", error);
            
            let diagnosis = "";
            
            if (error.message.includes('Failed to fetch')) {
                diagnosis = "🚨 <strong>CORS / Browser Blocked:</strong> Your browser killed the request because you are running the file directly (file:///). You absolutely <strong>must</strong> use a local server (like the VS Code 'Live Server' extension) or host it online to bypass this security block.";
            } else if (error.message.includes('HTTP 400')) {
                diagnosis = "❌ <strong>API Key Invalid:</strong> The API rejected the key. It might be malformed or invalid.";
            } else if (error.message.includes('HTTP 401') || error.message.includes('HTTP 403')) {
                diagnosis = "🚫 <strong>Permission Denied:</strong> Your key is valid but lacks permissions, or authentication failed.";
            } else if (error.message.includes('HTTP 429')) {
                diagnosis = "⏱️ <strong>Quota Exceeded:</strong> You have hit the rate limit for this free key.";
            } else {
                diagnosis = `⚠️ <strong>System Error:</strong> ${error.message}`;
            }

            aiBox.innerHTML = diagnosis;
        }
    }
    
    // ==========================================
    // --- Keyboard Navigation ---
    // ==========================================
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            
            // 1. If on the Quiz screen and the "Continue" button is visible
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn && !nextBtn.classList.contains('hidden')) {
                event.preventDefault(); 
                proceedToNext();
            }

            // 2. If on the Setup screen and typing in the Name box
            const setupSection = document.getElementById('setup-section');
            if (setupSection && !setupSection.classList.contains('hidden')) {
                if (document.activeElement.id === 'student-name') {
                    event.preventDefault();
                    startApp();
                }
            }
        }
    });
</script>
